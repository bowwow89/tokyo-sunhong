    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    .theme-rose .hero{background:linear-gradient(135deg,#e11d48,#f97316)}

    .today-btn{flex:0 0 auto;padding:9px 11px;border-radius:12px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:800;cursor:pointer}
    .day-pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 2px}
    .day-pager-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);cursor:pointer;box-shadow:0 2px 12px rgba(15,23,42,.04)}

    .day-pager-btn:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
    .day-pager-position{grid-column:1/-1;text-align:center;font-size:11px;font-weight:750;color:var(--muted);margin:1px 0 0}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 12px rgba(15,23,42,.04);margin-bottom:12px;overflow:hidden}

    .day-date{font-size:12px;font-weight:850;color:var(--primary)}
    .day-title{font-size:19px;font-weight:850;letter-spacing:-.025em;margin-top:3px}
    .day-note{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.55;white-space:pre-wrap}
    .progress{height:6px;border-radius:99px;background:#eef1f5;overflow:hidden;margin-top:12px}.progress>span{height:100%;display:block;background:var(--ok);border-radius:99px}

    .event+.event{border-top:1px solid #f0f2f6}
    .event-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:#f6f7fb;border:1px solid var(--line)}
    .event-main{min-width:0}
    .event-top{display:flex;align-items:center;gap:7px;min-height:25px}.time{font-size:12px;font-weight:850;color:#596273;background:#f3f4f6;padding:4px 7px;border-radius:7px}.event-done-btn{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid #d6dbe4;background:#fff;color:#fff;cursor:pointer;font-size:12px;font-weight:900}.event.done .event-done-btn{background:var(--ok);border-color:var(--ok)}

    .check-btn{width:23px;height:23px;flex:0 0 auto;border-radius:7px;border:2px solid #d7dce5;background:#fff;color:#fff;font-weight:900;cursor:pointer}.check-row.checked .check-btn{background:var(--ok);border-color:var(--ok)}.check-row.checked .check-text{text-decoration:line-through;color:#a1a8b3}.check-text{font-size:14px;flex:1}.tag{font-size:10px;font-weight:800;color:#64748b;background:#f3f4f6;padding:4px 6px;border-radius:6px}
    .budget-summary{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:13px;border-radius:14px;background:#f7f8fb}.metric small{display:block;color:#8490a3;font-size:11px;font-weight:800;margin-bottom:4px}.metric strong{font-size:18px}.budget-row{cursor:pointer}.budget-row.paid{opacity:.5}.budget-row.paid .budget-name{text-decoration:line-through}.budget-name{flex:1;font-size:14px;font-weight:700}.budget-amt{font-size:13px;font-weight:850}.budget-cat{font-size:10px;color:#8b95a6;margin-top:3px}
    .info-row{cursor:pointer}.info-icon{width:34px;height:34px;border-radius:10px;background:#f5f7fa;display:grid;place-items:center}.info-text{flex:1;min-width:0}.info-label{font-size:14px;font-weight:780}.info-val{font-size:12px;color:#929aaa;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.go{font-size:11px;font-weight:850;color:var(--primary);background:var(--primary-soft);padding:6px 8px;border-radius:8px}
    .bottom-nav{position:absolute;left:0;right:0;bottom:0;padding:8px 10px var(--safe-bottom);background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-top:1px solid rgba(226,232,240,.9);display:grid;grid-template-columns:repeat(4,1fr);z-index:50}
    .nav-btn{background:transparent;color:#9aa3b2;padding:7px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;cursor:pointer}.nav-btn .ico{font-size:19px;line-height:1}.nav-btn.active{color:var(--primary)}
    .landing{height:100%;display:grid;place-items:center;padding:24px}.landing-card{max-width:420px;width:100%;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px;text-align:center}.landing-emoji{font-size:54px}.landing h2{margin:12px 0 8px}.landing p{color:var(--muted);font-size:14px;line-height:1.55}.landing a{display:block;margin-top:18px;background:#172033;color:white;text-decoration:none;padding:13px;border-radius:12px;font-weight:800}
    .toast{position:absolute;left:50%;bottom:calc(86px + var(--safe-bottom));transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:#172033;color:white;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:750;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(min-width:761px){.app{box-shadow:0 20px 60px rgba(15,23,42,.15)}main{padding-left:18px;padding-right:18px}}
  </style>
</head>

<script>
(() => {
  const $ = (s, el=document) => el.querySelector(s);
  const $$ = (s, el=document) => [...el.querySelectorAll(s)];
  const esc = (v='') => String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const uid = () => 'id_' + Math.random().toString(36).slice(2,10);
  let data = null;
  const state = {tab:'sch', day:0, mode:'A', checks:{}, done:{}, budgetPaid:{}};
  const APPEARANCE_KEY = 'tripv2_appearance';
  let appearance = 'light';

  function loadAppearance(){
    // Always start in light mode, regardless of OS/browser appearance or a previous visit.
    appearance = 'light';
    try{ localStorage.removeItem(APPEARANCE_KEY); }catch(e){}
  }
  function applyAppearance(){
    document.body.classList.toggle('dark-mode', appearance==='dark');
    const btn=$('#theme-toggle');
    if(btn){
      btn.textContent = appearance==='dark' ? '☀️' : '🌙';
      btn.setAttribute('aria-label', appearance==='dark' ? '밝음 모드로 전환' : '어두움 모드로 전환');
      btn.title = appearance==='dark' ? '밝음 모드' : '어두움 모드';
    }
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', appearance==='dark' ? '#0f172a' : '#7c3aed');
  }
  function toggleAppearance(){
    // Manual toggle applies only for the current page session; reload starts light again.
    appearance = appearance==='dark' ? 'light' : 'dark';
    applyAppearance();
  }

  function normalize(raw){
    raw = raw && typeof raw === 'object' ? raw : {};
    const d = {
      version:2, id:raw.id || ('legacy_' + (raw.title || 'trip')),
      title:raw.title || '나만의 여행', destination:raw.destination || '',
      startDate:raw.startDate || '', endDate:raw.endDate || '', theme:({blue:'sky',pink:'rose',green:'forest',purple:'violet',gray:'slate'}[raw.theme] || raw.theme || 'sky'),
      currency:raw.currency || 'JPY', useMulti:!!raw.useMulti,
      planA:raw.planA || '', planB:raw.planB || '', planC:raw.planC || '',
      tips:Array.isArray(raw.tips) ? raw.tips.map(x => typeof x === 'string' ? {id:uid(),text:x} : {id:x.id||uid(),text:x.text||''}) : [],
      checks:Array.isArray(raw.checks) ? raw.checks : [], budgets:Array.isArray(raw.budgets) ? raw.budgets : [],
      infos:Array.isArray(raw.infos) ? raw.infos : [], days:Array.isArray(raw.days) ? raw.days : []
    };
    d.checks = d.checks.map(c => ({id:c.id||uid(), text:c.text||'', category:c.category||'', plans:c.plans || (!c.type || c.type==='all' ? ['A','B','C'] : [c.type])}));
    d.budgets = d.budgets.map(b => ({id:b.id||uid(),label:b.label||'',category:b.category||'',amount:Number(b.amount)||0,paid:!!b.paid}));
    d.infos = d.infos.map(i => ({id:i.id||uid(),label:i.label||'',val:i.val||'',type:i.type||'link',category:i.category||''}));
    d.days = d.days.map((day,di) => {
      const mapEvents = arr => (Array.isArray(arr)?arr:[]).map(e => ({
        id:e.id||uid(), time:e.time||e.t||'', type:e.type||'map', icon:e.icon||e.emoji||'📍', title:typeof e.title==='object'?(e.title.ko||Object.values(e.title)[0]||''):e.title||'',
        desc:typeof e.desc==='object'?(e.desc.ko||Object.values(e.desc)[0]||''):e.desc||'', map:e.map||e.loc||'', transport:typeof e.transport==='object'?(e.transport.ko||''):e.transport||(typeof e.trans==='object'?(e.trans.ko||''):e.trans||''),
        cost:e.cost||'', link:e.link||'', note:e.note||(e.p?('주차 '+e.p):'')||(e.warn?'주의사항 확인':'') , isCommon:!!e.isCommon
      }));
      return {id:day.id||uid(), date:day.date||'', title:day.title||'', note:day.note||'', eventsA:mapEvents(day.eventsA||day.events||[]), eventsB:mapEvents(day.eventsB), eventsC:mapEvents(day.eventsC)};
    });
    return d;
  }

  function load(){
    const h = location.hash;
    if(h.startsWith('#json=')){
      try{ data = normalize(JSON.parse(decodeURIComponent(h.slice(6)))); }
      catch(e){ console.error('Cannot read preview data', e); }
    }
    if(h.startsWith('#data=')){
      try{
        if(!window.LZString) throw new Error('compression library unavailable');
        const json = LZString.decompressFromEncodedURIComponent(h.slice(6));
        data = normalize(JSON.parse(json));
      }catch(e){ console.error(e); }
    }
    if(!data){
      try{ data = normalize(JSON.parse($('#trip-data').textContent)); }
      catch(e){ console.error('Cannot read embedded trip data', e); }
    }
    if(!data){ renderLanding(); return false; }
    const key = 'tripv2_state_' + data.id;
    try{ Object.assign(state, JSON.parse(localStorage.getItem(key)||'{}')); }catch(e){}
    const today = findTodayIndex();
    try{
      if(today >= 0 && !sessionStorage.getItem('tripv2_day_picked_'+data.id)){
        state.day = today; sessionStorage.setItem('tripv2_day_picked_'+data.id,'1');
      }
    }catch(e){ if(today >= 0) state.day = today; }
    state.day = Math.max(0, Math.min(state.day||0, Math.max(0,data.days.length-1)));
    return true;
  }

  function saveState(){
    try{ localStorage.setItem('tripv2_state_'+data.id, JSON.stringify(state)); }catch(e){}
  }
  function renderLanding(){
    $('#hero').style.display='none'; $('#bottom-nav').style.display='none';
    $('#main').innerHTML = `<div class="landing"><div class="landing-card"><div class="landing-emoji">🧳</div><h2>여행 데이터가 없어요</h2><p>빌더에서 일정을 만든 뒤 미리보기를 열거나 공유 링크로 접속해 주세요.</p><a href="builder.html">여행 계획 만들기</a></div></div>`;
  }
  function formatDate(iso){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return iso||'';
    const d = new Date(iso+'T00:00:00');
    return `${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`;
  }
  function tripLength(){
    if(data.startDate && data.endDate){
      const a=new Date(data.startDate+'T00:00:00'), b=new Date(data.endDate+'T00:00:00');
      const n=Math.round((b-a)/86400000)+1; if(n>0&&n<1000) return n;
    }
    return data.days.length;
  }
  function ddayText(){
    if(!data.startDate) return '';
    const today=new Date(); today.setHours(0,0,0,0);
    const s=new Date(data.startDate+'T00:00:00'); const e=data.endDate?new Date(data.endDate+'T00:00:00'):s;
    const diff=Math.round((s-today)/86400000);
    if(today>=s&&today<=e) return '여행 중 ✨';
    if(diff===0) return '오늘 출발 ✈️';
    if(diff>0) return `D-${diff}`;
    return '';
  }
  function findTodayIndex(){
    const y = new Date(); const iso = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
    return data.days.findIndex(d => d.date === iso);
  }
  function currentPlanEvents(day){
    let arr = state.mode==='B'?(day.eventsB||[]):state.mode==='C'?(day.eventsC||[]):(day.eventsA||[]);
    if(state.mode!=='A') arr = [...arr, ...(day.eventsA||[]).filter(e=>e.isCommon)];
    return [...arr].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  }
  function renderChrome(){
    document.body.className = 'theme-' + (data.theme||'sky');
    applyAppearance();
    $('#title').textContent=data.title; $('#destination').textContent=data.destination||'TRIP GUIDE';
    const parts=[]; if(data.startDate) parts.push(`${formatDate(data.startDate)}${data.endDate&&data.endDate!==data.startDate?' ~ '+formatDate(data.endDate):''}`); if(tripLength()) parts.push(`${tripLength()}일`); const dd=ddayText(); if(dd) parts.push(dd);
    $('#hero-meta').innerHTML = parts.map(x=>`<span>${esc(x)}</span>`).join('<span>•</span>');
    const sw=$('#plan-switch');
    if(data.useMulti){
      const plans=[['A',data.planA||'Plan A'],['B',data.planB||'Plan B'],['C',data.planC||'Plan C']].filter(([k,n])=>k==='A'||n);
      sw.hidden=false; sw.innerHTML=plans.map(([k,n])=>`<button class="plan-btn ${state.mode===k?'active':''}" data-mode="${k}">${esc(n)}</button>`).join('');
    }else sw.hidden=true;
    $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  }
  function render(){
    renderChrome(); const c=$('#content');
    if(state.tab==='sch') c.innerHTML=renderSchedule();
    else if(state.tab==='chk') c.innerHTML=renderChecks();
    else if(state.tab==='budget') c.innerHTML=renderBudget();
    else c.innerHTML=renderInfo();
  }
  function renderSchedule(){
    if(!data.days.length) return `<div class="card"><div class="empty">등록된 일정이 없어요.</div></div>`;
    const todayIdx=findTodayIndex();
    const tabs=data.days.map((d,i)=>`<button class="day-btn ${i===state.day?'active':''}" data-day="${i}">Day ${i+1}<br><span style="font-weight:650;opacity:.72">${esc(formatDate(d.date))}</span></button>`).join('');
    const day=data.days[state.day]||data.days[0], evs=currentPlanEvents(day);
    const total=evs.length, done=evs.filter(e=>state.done[e.id]).length, pct=total?Math.round(done/total*100):0;
    const head=`<div class="today-bar"><div class="day-tabs">${tabs}</div>${todayIdx>=0?`<button class="today-btn" data-day="${todayIdx}">오늘</button>`:''}</div>
      ${data.tips.length?`<div class="card tips"><div class="tips-title">✦ 여행 포인트</div>${data.tips.filter(t=>t.text).map(t=>`<div class="tip">${esc(t.text)}</div>`).join('')}</div>`:''}
      <div class="card"><div class="day-head"><div class="day-date">DAY ${state.day+1} · ${esc(formatDate(day.date))}</div><div class="day-title">${esc(day.title||'오늘의 일정')}</div>${day.note?`<div class="day-note">${esc(day.note)}</div>`:''}<div class="progress"><span style="width:${pct}%"></span></div><div class="progress-text">일정 ${done}/${total} 완료</div></div><div class="timeline">`;
    const body=evs.length?evs.map(e=>renderEvent(e)).join(''):`<div class="empty">이 플랜에는 일정이 없어요.</div>`;
    const previous=data.days[state.day-1], next=data.days[state.day+1];
    const pager=`<nav class="day-pager" aria-label="일정 날짜 이동">
      <button type="button" class="day-pager-btn previous" ${previous?`data-day="${state.day-1}"`:'disabled'}>
        <span class="day-pager-arrow" aria-hidden="true">←</span>
        <span class="day-pager-copy"><strong>전날</strong><small>${previous?esc(formatDate(previous.date)):'첫날이에요'}</small></span>
      </button>
      <button type="button" class="day-pager-btn next" ${next?`data-day="${state.day+1}"`:'disabled'}>
        <span class="day-pager-copy"><strong>다음날</strong><small>${next?esc(formatDate(next.date)):'마지막 날이에요'}</small></span>
        <span class="day-pager-arrow" aria-hidden="true">→</span>
      </button>
      <p class="day-pager-position">DAY ${state.day+1} / ${data.days.length}</p>
    </nav>`;
    return head+body+'</div></div>'+pager;
  }
  function renderEvent(e){
    const done=!!state.done[e.id];
    const chips=[]; if(e.isCommon) chips.push(`<span class="chip common">공통 일정</span>`); if(e.transport) chips.push(`<span class="chip transport">🚆 ${esc(e.transport)}</span>`); if(e.cost) chips.push(`<span class="chip cost">💴 ${esc(e.cost)}</span>`); if(e.note) chips.push(`<span class="chip note">⚠ ${esc(e.note)}</span>`);
    const acts=[]; if(e.map) acts.push(`<button class="action primary" data-map="${esc(e.map)}">📍 지도</button>`); if(e.map) acts.push(`<button class="action" data-copy="${esc(e.map)}">복사</button>`); if(e.link) acts.push(`<button class="action" data-link="${esc(e.link)}">🔗 예약/링크</button>`);
    return `<div class="event ${done?'done':''}"><div class="event-icon">${esc(e.icon||'📍')}</div><div class="event-main"><div class="event-top"><span class="time">${esc(e.time||'시간 미정')}</span><button class="event-done-btn" data-done="${esc(e.id)}" aria-label="완료">${done?'✓':''}</button></div><div class="event-title">${esc(e.title||'제목 없음')}</div>${e.desc?`<div class="event-desc">${esc(e.desc)}</div>`:''}${chips.length?`<div class="chips">${chips.join('')}</div>`:''}${acts.length?`<div class="actions">${acts.join('')}</div>`:''}</div></div>`;
  }
  function renderChecks(){
    const list=(data.checks||[]).filter(c=>!data.useMulti || (c.plans||['A','B','C']).includes(state.mode));
    const done=list.filter(c=>state.checks[c.id]).length;
    return `<div class="card"><div class="section-title">준비물 체크 · ${done}/${list.length} 완료</div>${list.length?list.map(c=>`<div class="check-row ${state.checks[c.id]?'checked':''}"><button class="check-btn" data-check="${esc(c.id)}">${state.checks[c.id]?'✓':''}</button><div class="check-text">${esc(c.text)}</div>${c.category?`<span class="tag">${esc(c.category)}</span>`:''}</div>`).join(''):`<div class="empty">체크리스트가 비어 있어요.</div>`}</div>`;
  }
  function money(n){ return new Intl.NumberFormat('ko-KR').format(Number(n)||0) + ' ' + esc(data.currency||''); }
  function renderBudget(){
    const list=data.budgets||[]; const total=list.reduce((s,b)=>s+(Number(b.amount)||0),0); const paid=list.reduce((s,b)=>s+((state.budgetPaid[b.id]??b.paid)?(Number(b.amount)||0):0),0);
    return `<div class="card"><div class="budget-summary"><div class="metric"><small>예상 총액</small><strong>${money(total)}</strong></div><div class="metric"><small>결제 완료</small><strong>${money(paid)}</strong></div></div>${list.length?list.map(b=>{const p=state.budgetPaid[b.id]??b.paid;return `<div class="budget-row ${p?'paid':''}" data-budget="${esc(b.id)}"><div style="flex:1"><div class="budget-name">${esc(b.label||'항목')}</div>${b.category?`<div class="budget-cat">${esc(b.category)}</div>`:''}</div><div class="budget-amt">${money(b.amount)}</div></div>`}).join(''):`<div class="empty">예산 항목이 없어요.</div>`}</div>`;
  }
  function renderInfo(){
    const list=data.infos||[]; return `<div class="card"><div class="section-title">여행 중 바로 쓰기</div>${list.length?list.map(i=>{const icon=i.type==='tel'?'📞':i.type==='map'?'📍':i.type==='copy'?'📋':i.type==='text'?'📝':'🔗';const go=i.type==='tel'?'전화':i.type==='map'?'지도':i.type==='copy'?'복사':i.type==='text'?'보기':'열기';return `<div class="info-row" data-info="${esc(i.id)}"><div class="info-icon">${icon}</div><div class="info-text"><div class="info-label">${esc(i.label||'정보')}</div><div class="info-val">${esc(i.val||'')}</div></div><span class="go">${go}</span></div>`}).join(''):`<div class="empty">등록된 정보가 없어요.</div>`}</div>`;
  }
  function safeOpen(url){ try{ const u=new URL(url,location.href); if(['http:','https:'].includes(u.protocol)) window.open(u.href,'_blank','noopener'); else toast('열 수 없는 링크예요'); }catch(e){ toast('링크 형식을 확인해 주세요'); } }
  function openMap(q){
    if(/^https?:\/\//i.test(q)) safeOpen(q);
    else window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank','noopener');
  }
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1500)}

  function isLocalPreview(){
    return ['file:','blob:','data:'].includes(location.protocol) ||
      ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  }

  function downloadTripJSON(){
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'tokyo-sunhong-2026-12.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  async function share(){
    if(isLocalPreview()){
      downloadTripJSON();
      alert('이 HTML은 기기에 저장된 여행 파일이에요. 공개 웹주소가 만들어지는 것은 아니에요. HTML 파일 자체를 보내거나, 방금 저장한 JSON 백업을 상대방의 편집기에서 불러오세요.');
      return;
    }
    const payload={title:data.title,text:(data.destination?data.destination+' · ':'')+data.title,url:location.href};
    if(navigator.share){try{await navigator.share(payload);return}catch(e){if(e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(location.href);toast('링크를 복사했어요')}catch(e){prompt('링크를 복사하세요',location.href)}
  }
  async function handleInfo(id){
    const i=data.infos.find(x=>x.id===id); if(!i)return;
    if(i.type==='tel'){ if(confirm(`${i.label}\n${i.val}\n\n통화 연결할까요?`)) location.href='tel:'+i.val; }
    else if(i.type==='map') openMap(i.val);
    else if(i.type==='copy'){ try{await navigator.clipboard.writeText(i.val); toast('복사했어요');}catch(e){prompt('복사하세요',i.val);} }
    else if(i.type==='text') alert(`${i.label}\n\n${i.val}`);
    else if(i.val) safeOpen(i.val);
  }
  document.addEventListener('click', async e=>{
    const tab=e.target.closest('[data-tab]'); if(tab){state.tab=tab.dataset.tab;render();$('#main').scrollTop=0;saveState();return}
    const day=e.target.closest('[data-day]'); if(day){
      const index=Number(day.dataset.day);
      if(day.disabled||!Number.isInteger(index)||index<0||index>=data.days.length)return;
      state.day=index; render();
      $(`.day-btn[data-day="${index}"]`)?.focus({preventScroll:true});
      $('#main').scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
      saveState(); return;
    }
    const mode=e.target.closest('[data-mode]'); if(mode){state.mode=mode.dataset.mode;render();saveState();return}
    const done=e.target.closest('[data-done]'); if(done){state.done[done.dataset.done]=!state.done[done.dataset.done];render();saveState();return}
    const chk=e.target.closest('[data-check]'); if(chk){state.checks[chk.dataset.check]=!state.checks[chk.dataset.check];render();saveState();return}
    const bud=e.target.closest('[data-budget]'); if(bud){const b=data.budgets.find(x=>x.id===bud.dataset.budget);const cur=state.budgetPaid[b.id]??b.paid;state.budgetPaid[b.id]=!cur;render();saveState();return}
    const map=e.target.closest('[data-map]'); if(map){openMap(map.dataset.map);return}
    const link=e.target.closest('[data-link]'); if(link){safeOpen(link.dataset.link);return}
    const copy=e.target.closest('[data-copy]'); if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);toast('장소를 복사했어요')}catch(err){}return}
    const inf=e.target.closest('[data-info]'); if(inf){await handleInfo(inf.dataset.info);return}
  });
  $('#share-btn').addEventListener('click',share);
  $('#theme-toggle').addEventListener('click',toggleAppearance);
  loadAppearance();
  applyAppearance();
  // Standalone files need no CDN. Load LZ-String only for an older #data link.
  if(location.hash.startsWith('#data=') && !window.LZString){
    const script=document.createElement('script');
    script.src='https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js';
    script.onload=()=>{if(load()) render();};
    script.onerror=()=>{
      if(load()) render();
      toast('압축 링크를 읽지 못해 이 파일의 기본 일정을 열었어요');
    };
    document.head.appendChild(script);
  }else if(load()) render();
})();
</script>
</body>
</html>
